<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="post-title post-desc">
<title id="post-title">Nồi nước dùng bắt đầu từ 4 giờ sáng</title>
<desc id="post-desc">Concept feed post layout: a schematic bowl above a headline, three proof lines and a call to action.</desc>
<rect width="100%" height="100%" fill="#f5f1e8"/><rect x="0" y="0" width="1080" height="594" fill="#e7e1d4"/><ellipse cx="540" cy="210" rx="282" ry="113" fill="#231f20"/><path d="M258 210 A282 113 0 0 0 822 210 L715 384 A175 70 0 0 1 365 384 Z" fill="#231f20"/><ellipse cx="540" cy="210" rx="248" ry="99" fill="#a8432e"/><path d="M371 221 Q540 291 709 221" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M416 176 Q540 135 664 176" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<text x="90" y="701" fill="#df4b2e" class="kicker"><tspan x="90" dy="0">BÚN BÒ / BÀI ĐĂNG MẪU</tspan></text>
<text x="90" y="791" fill="#171717" class="headline"><tspan x="90" dy="0">Nồi nước dùng bắt đầu từ</tspan><tspan x="90" dy="87">4 giờ sáng</tspan></text>
<text x="90" y="938" fill="#171717" class="subhead"><tspan x="90" dy="0">Bố cục mẫu cho bài feed. Mọi câu khẳng định bên dưới phải do</tspan><tspan x="90" dy="37">quán xác nhận trước khi đăng.</tspan></text>
<rect x="90" y="1016" width="8" height="8" fill="#df4b2e"/><text x="124" y="1024" fill="#171717" class="proof"><tspan x="124" dy="0">Giờ mở nồi: chờ quán xác nhận — không suy ra từ ảnh</tspan></text><rect x="90" y="1060" width="8" height="8" fill="#df4b2e"/><text x="124" y="1068" fill="#171717" class="proof"><tspan x="124" dy="0">Nguồn ruốc và bò: chờ quán xác nhận</tspan></text><rect x="90" y="1104" width="8" height="8" fill="#df4b2e"/><text x="124" y="1112" fill="#171717" class="proof"><tspan x="124" dy="0">Khung giờ bán: chờ quán xác nhận</tspan></text>
<rect x="90" y="1191" width="234" height="64" rx="32" fill="#df4b2e"/><text x="207" y="1234" text-anchor="middle" fill="#f5f1e8" style="font:700 30px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;letter-spacing:2px">Xem menu</text><text x="350" y="1231" fill="#171717" class="offer"><tspan x="350" dy="0">Ưu đãi: UNKNOWN — chưa có ai duyệt ưu đãi nào</tspan></text>
<line x1="90" y1="1285" x2="990" y2="1285" stroke="#171717" stroke-opacity=".25"/>
<text x="90" y="1320" fill="#171717" class="footer">CONCEPT POST / Không phải nội dung đã duyệt</text>
<style>.kicker{font:700 24px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;letter-spacing:4px}.headline{font:700 70px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif}.subhead{font:400 30px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;opacity:.82}.proof{font:400 27px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;opacity:.86}.offer{font:600 21px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;opacity:.78}.footer{font:400 17px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;opacity:.6}</style></svg>