<text x="120" y="933" fill="#b65f45" class="kicker"><tspan x="120" dy="0">BÚN BÒ / STORY 9:16</tspan></text>
<text x="120" y="1032" fill="#171717" class="headline"><tspan x="120" dy="0">Bán tới khi hết nồi</tspan></text>
<text x="120" y="1094" fill="#171717" class="subhead"><tspan x="120" dy="0">Cùng một tin, dựng lại cho 9:16 — không phải bản feed bị</tspan><tspan x="120" dy="37">cắt. Vùng trên 250px và dưới 420px để trống cho khung</tspan><tspan x="120" dy="37">giao diện của ứng dụng.</tspan></text>
<rect x="120" y="1209" width="8" height="8" fill="#b65f45"/><text x="154" y="1217" fill="#171717" class="proof"><tspan x="154" dy="0">Số phần mỗi ngày: chờ quán xác nhận</tspan></text><rect x="120" y="1253" width="8" height="8" fill="#b65f45"/><text x="154" y="1261" fill="#171717" class="proof"><tspan x="154" dy="0">Giờ thường hết nồi: chờ quán xác nhận</tspan></text>
