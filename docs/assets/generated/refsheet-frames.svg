<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="934" viewBox="0 0 1400 934"><rect width="1400" height="934" fill="#F5F1E8"/><text x="60" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38.0" fill="#141414" font-weight="700">Where the copy goes, and where the app covers it</text><text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#8A8478"><tspan x="60" dy="0">Each frame is drawn at its true proportion. Cobalt is the area kept deliberately empty so type can sit there. Solid grey is the band the platform draws its own</tspan><tspan x="60" dy="21">interface over: copy there is not tight against the edge, it is behind a button. A story is laid out again, not cropped from the feed post. One frame here has no</tspan><tspan x="60" dy="21">reserve on purpose, and says why.</tspan></text><rect x="60" y="209" width="1280" height="2" fill="#141414"/><rect x="60" y="415" width="229" height="229" fill="#E7E1D4"/><rect x="60" y="415" width="229" height="229" fill="none" stroke="#141414" stroke-width="2"/><text x="60" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19.0" fill="#141414" font-weight="700">Feed square</text><text x="60" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#2A4BD7">1080 x 1080</text><text x="60" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#8A8478"><tspan x="60" dy="0">Marketplace tiles, and the one ratio</tspan><tspan x="60" dy="16">every channel accepts. No reserve:</tspan><tspan x="60" dy="16">the platform prints the title and price</tspan><tspan x="60" dy="16">under the tile, not on it, so type on</tspan><tspan x="60" dy="16">the image duplicates it</tspan></text><rect x="323" y="358" width="229" height="286" fill="#E7E1D4"/><rect x="323" y="358" width="229" height="97" fill="#2A4BD7" opacity="0.16"/><rect x="323" y="358" width="229" height="286" fill="none" stroke="#141414" stroke-width="2"/><text x="323" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19.0" fill="#141414" font-weight="700">Feed portrait</text><text x="323" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#2A4BD7">1080 x 1350</text><text x="323" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#8A8478"><tspan x="323" dy="0">The largest area a feed will give</tspan><tspan x="323" dy="16">you, so the headline can be large</tspan></text><rect x="586" y="237" width="229" height="407" fill="#E7E1D4"/><rect x="586" y="290" width="229" height="265" fill="#2A4BD7" opacity="0.16"/><rect x="586" y="237" width="229" height="53" fill="#8A8478" opacity="0.55"/><rect x="586" y="555" width="229" height="89" fill="#8A8478" opacity="0.55"/><rect x="586" y="237" width="229" height="407" fill="none" stroke="#141414" stroke-width="2"/><text x="586" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19.0" fill="#141414" font-weight="700">Story / Reel</text><text x="586" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#2A4BD7">1080 x 1920</text><text x="586" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#8A8478"><tspan x="586" dy="0">Everything must live between the</tspan><tspan x="586" dy="16">bands. This is why a story is laid</tspan><tspan x="586" dy="16">out again rather than cropped from</tspan><tspan x="586" dy="16">the feed post</tspan></text><text x="586" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="586" dy="0">App draws its own interface over</tspan><tspan x="586" dy="16">250px top, 420px bottom</tspan></text><rect x="848" y="515" width="229" height="129" fill="#E7E1D4"/><rect x="848" y="515" width="82" height="129" fill="#2A4BD7" opacity="0.16"/><rect x="848" y="515" width="229" height="129" fill="none" stroke="#141414" stroke-width="2"/><text x="848" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19.0" fill="#141414" font-weight="700">Landscape</text><text x="848" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#2A4BD7">1920 x 1080</text><text x="848" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#8A8478"><tspan x="848" dy="0">Video, web hero, presentation. Type</tspan><tspan x="848" dy="16">goes to one side because the</tspan><tspan x="848" dy="16">subject cannot be centred and</tspan><tspan x="848" dy="16">covered at once</tspan></text><rect x="1111" y="320" width="229" height="324" fill="#E7E1D4"/><rect x="1111" y="331" width="229" height="48" fill="#2A4BD7" opacity="0.16"/><rect x="1111" y="320" width="229" height="11" fill="#8A8478" opacity="0.55"/><rect x="1111" y="633" width="229" height="11" fill="#8A8478" opacity="0.55"/><rect x="1111" y="320" width="229" height="324" fill="none" stroke="#141414" stroke-width="2"/><text x="1111" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19.0" fill="#141414" font-weight="700">Print A4 menu</text><text x="1111" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#2A4BD7">1240 x 1754</text><text x="1111" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#8A8478"><tspan x="1111" dy="0">Nothing that must survive can enter</tspan><tspan x="1111" dy="16">the grey. Screens forgive an edge; a</tspan><tspan x="1111" dy="16">guillotine does not</tspan></text><text x="1111" y="774" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="1111" dy="0">Trim margin 60px — a print shop</tspan><tspan x="1111" dy="16">cuts into this</tspan></text></svg>
