<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title subtitle">
<title id="title">Một tô, mỗi sáng</title><desc id="subtitle">Bản minh họa bố cục — giá và thành phần phải được quán xác nhận</desc>
<defs><clipPath id="hero-clip"><rect x="690" y="88" width="270" height="216" rx="0"/></clipPath></defs>
<rect width="100%" height="100%" fill="#f3efe6"/><line x1="120" y1="56" x2="960" y2="56" stroke="#b65f45" stroke-width="2"/>
<text x="120" y="120" fill="#171717" class="kicker">BÚN BÒ</text>
<text x="120" y="176" fill="#171717" class="title">Một tô, mỗi sáng</text><text x="120" y="208" fill="#171717" class="subtitle"><tspan x="120" dy="0">Bản minh họa bố cục — giá và thành phần phải</tspan><tspan x="120" dy="30">được quán xác nhận</tspan></text><ellipse cx="825" cy="183" rx="135" ry="64" fill="#231f20"/><ellipse cx="825" cy="166" rx="123" ry="49" fill="#a8432e"/><path d="M734 158 Q825 204 916 158" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M758 136 Q825 105 892 136" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<line x1="120" y1="336" x2="960" y2="336" stroke="#171717" stroke-opacity=".25"/><text x="120" y="372" fill="#b65f45" class="category">MÓN CHÍNH</text><text x="120" y="442" class="item">Tô tiêu chuẩn</text><text x="120" y="470" class="desc">Khẩu phần và thành phần chờ quán xác nhận</text><text x="960" y="442" text-anchor="end" class="price">—</text>
<text x="120" y="565" class="item">Tô đặc biệt</text><text x="120" y="593" class="desc">Không tự suy ra topping từ ảnh tham chiếu</text><text x="960" y="565" text-anchor="end" class="price">—</text>
<text x="120" y="688" class="item">Phần thêm</text><text x="120" y="716" class="desc">Chỉ hiển thị khi có menu và giá nguồn</text><text x="960" y="688" text-anchor="end" class="price">—</text>
<text x="120" y="811" class="item">Đồ uống</text><text x="120" y="839" class="desc">Sắp theo logic hoàn tất giỏ hàng</text><text x="960" y="811" text-anchor="end" class="price">—</text>
<line x1="120" y1="1024" x2="960" y2="1024" stroke="#171717" stroke-opacity=".25"/><text x="120" y="1056" fill="#171717" class="footer">CONCEPT LAYOUT / Không phải menu giá đã được duyệt</text>
