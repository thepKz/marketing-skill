<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title subtitle">
<title id="title">Một tô, mỗi sáng</title><desc id="subtitle">Quán và giá là ví dụ hư cấu — minh họa bố cục thật</desc>
<defs><clipPath id="hero-clip"><rect x="636" y="94" width="324" height="216" rx="0"/></clipPath></defs>
<rect width="100%" height="100%" fill="#f3efe6"/><line x1="120" y1="56" x2="960" y2="56" stroke="#b65f45" stroke-width="2"/>
<text x="120" y="110" fill="#171717" class="kicker"><tspan x="120" dy="0">BÚN BÒ</tspan></text>
<text x="120" y="197" fill="#171717" class="title"><tspan x="120" dy="0">Một tô, mỗi</tspan><tspan x="120" dy="87">sáng</tspan></text><text x="120" y="335" fill="#171717" class="subtitle"><tspan x="120" dy="0">Quán và giá là ví dụ hư cấu — minh họa bố</tspan><tspan x="120" dy="30">cục thật</tspan></text><image href="bun-bo-photoreal-menu-hero.png" x="636" y="94" width="324" height="216" preserveAspectRatio="xMidYMid slice" clip-path="url(#hero-clip)"/>
<line x1="120" y1="415" x2="960" y2="415" stroke="#171717" stroke-opacity=".25"/><text x="120" y="500" fill="#b65f45" class="category">MÓN CHÍNH</text><text x="120" y="560" class="item"><tspan x="120" dy="0">Bún bò giò heo</tspan></text><text x="120" y="589" class="desc"><tspan x="120" dy="0">Chân giò hầm mềm, nêm sả và mắm ruốc theo lối Huế</tspan></text><text x="960" y="560" text-anchor="end" class="price">65.000đ</text>
<text x="120" y="683" class="item"><tspan x="120" dy="0">Bún bò đặc biệt</tspan></text><text x="120" y="712" class="desc"><tspan x="120" dy="0">Đủ giò, chả cua, huyết, thịt bò tái</tspan></text><text x="960" y="683" text-anchor="end" class="price">79.000đ</text>
<text x="120" y="806" class="item"><tspan x="120" dy="0">Chả cua chiên</tspan></text><text x="120" y="835" class="desc"><tspan x="120" dy="0">Món thêm, giòn ngoài mềm trong</tspan></text><text x="960" y="806" text-anchor="end" class="price">25.000đ</text>
<text x="120" y="929" class="item"><tspan x="120" dy="0">Trà đá / trà chanh</tspan></text><text x="120" y="958" class="desc"><tspan x="120" dy="0">Đi kèm mọi phần chính, giải nhiệt</tspan></text><text x="960" y="929" text-anchor="end" class="price">10.000đ</text>
<line x1="120" y1="1024" x2="960" y2="1024" stroke="#171717" stroke-opacity=".25"/><text x="120" y="1056" fill="#171717" class="footer">CONCEPT MENU / Quán, món và giá đều hư cấu — minh họa bố cục</text>
<style>.kicker{font:600 22px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;letter-spacing:4px}.title{font:700 70px Cambria, Constantia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', 'Noto Serif', serif}.subtitle{font:400 24px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif}.category{font:700 20px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;letter-spacing:3px}.item{font:700 28px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif}.marker{font:700 20px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#b65f45;opacity:.9}.desc{font:400 19px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#171717;opacity:.72}.price{font:700 26px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#b65f45}.footer{font:400 15px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;opacity:.65}</style></svg>