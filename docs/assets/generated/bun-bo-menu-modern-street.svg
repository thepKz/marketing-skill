<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title subtitle">
<title id="title">Bún bò mỗi ngày</title><desc id="subtitle">Bản minh họa bố cục — giá và thành phần phải được quán xác nhận</desc>
<defs><clipPath id="hero-clip"><rect x="690" y="88" width="300" height="216" rx="0"/></clipPath></defs>
<rect width="100%" height="100%" fill="#f5f1e8"/><rect x="70" y="56" width="940" height="8" fill="#df4b2e"/>
<text x="90" y="120" fill="#171717" class="kicker">BÚN BÒ / SIGNATURE MENU</text>
<text x="90" y="176" fill="#171717" class="title">Bún bò mỗi ngày</text><text x="90" y="208" fill="#171717" class="subtitle"><tspan x="90" dy="0">Bản minh họa bố cục — giá và thành phần phải</tspan><tspan x="90" dy="30">được quán xác nhận</tspan></text><ellipse cx="840" cy="183" rx="150" ry="72" fill="#231f20"/><ellipse cx="840" cy="165" rx="136" ry="54" fill="#a8432e"/><path d="M738 155 Q840 206 942 155" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M765 131 Q840 96 915 131" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<line x1="90" y1="336" x2="990" y2="336" stroke="#171717" stroke-opacity=".25"/><text x="90" y="372" fill="#df4b2e" class="category">MÓN CHÍNH</text><text x="90" y="442" class="marker">01</text><text x="136" y="442" class="item">Bún bò tiêu chuẩn</text><text x="136" y="470" class="desc">Tên, khẩu phần và thành phần chờ xác nhận</text><text x="990" y="442" text-anchor="end" class="price">—</text>
<text x="90" y="547" class="marker">02</text><text x="136" y="547" class="item">Bún bò đặc biệt</text><text x="136" y="575" class="desc">Không tự suy ra topping từ ảnh tham chiếu</text><text x="990" y="547" text-anchor="end" class="price">—</text>
<text x="90" y="652" class="marker">03</text><text x="136" y="652" class="item">Phần thêm</text><text x="136" y="680" class="desc">Chỉ hiển thị khi có menu và giá nguồn</text><text x="990" y="652" text-anchor="end" class="price">—</text>
<text x="90" y="757" class="marker">04</text><text x="136" y="757" class="item">Đồ uống</text><text x="136" y="785" class="desc">Sắp theo logic hoàn tất giỏ hàng</text><text x="990" y="757" text-anchor="end" class="price">—</text>
<line x1="90" y1="1024" x2="990" y2="1024" stroke="#171717" stroke-opacity=".25"/><text x="90" y="1056" fill="#171717" class="footer">CONCEPT LAYOUT / Không phải menu giá đã được duyệt</text>
