<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title subtitle">
<title id="title">Bún bò mỗi ngày</title><desc id="subtitle">Quán và giá là ví dụ hư cấu — minh họa bố cục thật</desc>
<defs><clipPath id="hero-clip"><rect x="666" y="94" width="324" height="216" rx="0"/></clipPath></defs>
<rect width="100%" height="100%" fill="#f5f1e8"/><rect x="70" y="56" width="940" height="8" fill="#df4b2e"/>
<text x="90" y="110" fill="#171717" class="kicker"><tspan x="90" dy="0">BÚN BÒ / SIGNATURE MENU</tspan></text>
<text x="90" y="190" fill="#171717" class="title"><tspan x="90" dy="0">Bún bò mỗi ngày</tspan></text><text x="90" y="239" fill="#171717" class="subtitle"><tspan x="90" dy="0">Quán và giá là ví dụ hư cấu — minh họa bố cục</tspan><tspan x="90" dy="30">thật</tspan></text><ellipse cx="828" cy="159" rx="162" ry="65" fill="#231f20"/><path d="M666 159 A162 65 0 0 0 990 159 L928 245 A100 40 0 0 1 728 245 Z" fill="#231f20"/><ellipse cx="828" cy="159" rx="143" ry="57" fill="#a8432e"/><path d="M731 165 Q828 205 925 165" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M757 139 Q828 116 899 139" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<line x1="90" y1="354" x2="990" y2="354" stroke="#171717" stroke-opacity=".25"/><text x="90" y="497" fill="#df4b2e" class="category">MÓN CHÍNH</text><text x="90" y="557" class="marker">01</text><text x="136" y="557" class="item"><tspan x="136" dy="0">Bún bò giò heo</tspan></text><text x="136" y="586" class="desc"><tspan x="136" dy="0">Chân giò hầm mềm, nêm sả và mắm ruốc theo lối Huế</tspan></text><text x="990" y="557" text-anchor="end" class="price">65.000đ</text>
<text x="90" y="662" class="marker">02</text><text x="136" y="662" class="item"><tspan x="136" dy="0">Bún bò đặc biệt</tspan></text><text x="136" y="691" class="desc"><tspan x="136" dy="0">Đủ giò, chả cua, huyết, thịt bò tái</tspan></text><text x="990" y="662" text-anchor="end" class="price">79.000đ</text>
<text x="90" y="767" class="marker">03</text><text x="136" y="767" class="item"><tspan x="136" dy="0">Chả cua chiên</tspan></text><text x="136" y="796" class="desc"><tspan x="136" dy="0">Món thêm, giòn ngoài mềm trong</tspan></text><text x="990" y="767" text-anchor="end" class="price">25.000đ</text>
<text x="90" y="872" class="marker">04</text><text x="136" y="872" class="item"><tspan x="136" dy="0">Trà đá / trà chanh</tspan></text><text x="136" y="901" class="desc"><tspan x="136" dy="0">Đi kèm mọi phần chính, giải nhiệt</tspan></text><text x="990" y="872" text-anchor="end" class="price">10.000đ</text>
<line x1="90" y1="1024" x2="990" y2="1024" stroke="#171717" stroke-opacity=".25"/><text x="90" y="1056" fill="#171717" class="footer">CONCEPT MENU / Quán, món và giá đều hư cấu — minh họa bố cục</text>
