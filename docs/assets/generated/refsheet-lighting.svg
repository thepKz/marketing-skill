<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1222" viewBox="0 0 1400 1222"><rect width="1400" height="1222" fill="#F5F1E8"/><text x="60" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38.0" fill="#141414" font-weight="700">Lighting plans, seen from above</text><text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#8A8478"><tspan x="60" dy="0">The camera is the triangle below each square and the subject is the black disc in the middle. Blue is the key — the one light that decides the picture. Orange</tspan><tspan x="60" dy="21">is fill or bounce. Black bars are flags, which take light away. The grey wedge is the shadow, drawn from the key position, so it always agrees with the light.</tspan><tspan x="60" dy="21">Pick one setup and name it in the brief; a named source is what lets you reject a highlight later.</tspan></text><rect x="60" y="209" width="1280" height="2" fill="#141414"/><rect x="60" y="237" width="252" height="252" fill="#EFE9DE"/><path d="M173.2,380.5 L227.3,434.4 L265.9,383.0 L198.9,346.2 Z" fill="#8A8478" opacity="0.38"/><circle cx="186" cy="363" r="19" fill="#141414"/><path d="M175,505 L197,505 L186,492 Z" fill="#141414"/><text x="204" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><circle cx="105" cy="303" r="28" fill="#2A4BD7"/><line x1="105" y1="303" x2="186" y2="363" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><circle cx="277" cy="343" r="18" fill="#D9541E"/><text x="60" y="541" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">45/45 soft key</text><text x="60" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="60" dy="0">The default for a packshot, a founder portrait, and most food.</tspan><tspan x="60" dy="17">One decision, hard to get wrong.</tspan></text><text x="60" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="60" dy="0">— Large soft source, front-left, 45° around and 30° up</tspan></text><text x="60" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="60" dy="0">— White bounce, right, one to two stops down</tspan></text><rect x="497" y="237" width="252" height="252" fill="#EFE9DE"/><path d="M622.7,384.7 L698.4,395.5 L698.4,331.2 L622.7,341.9 Z" fill="#8A8478" opacity="0.38"/><circle cx="623" cy="363" r="19" fill="#141414"/><path d="M612,505 L634,505 L623,492 Z" fill="#141414"/><text x="641" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><circle cx="512" cy="363" r="28" fill="#2A4BD7"/><line x1="512" y1="363" x2="623" y2="363" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><circle cx="724" cy="376" r="18" fill="#D9541E"/><text x="497" y="541" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">Window and bounce</text><text x="497" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="497" dy="0">What a shop already has. Costs nothing and reads as a real</tspan><tspan x="497" dy="17">place rather than a set.</tspan></text><text x="497" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="497" dy="0">— The actual window, side-on to the subject</tspan></text><text x="497" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="497" dy="0">— Anything white opposite it — a wall, a menu, a shirt</tspan></text><rect x="933" y="237" width="252" height="252" fill="#EFE9DE"/><path d="M1064.0,384.2 L1140.1,378.7 L1126.5,315.8 L1054.8,342.4 Z" fill="#8A8478" opacity="0.38"/><circle cx="1059" cy="363" r="19" fill="#141414"/><path d="M1048,505 L1070,505 L1059,492 Z" fill="#141414"/><text x="1077" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><circle cx="943" cy="389" r="18" fill="#2A4BD7"/><line x1="943" y1="389" x2="1059" y2="363" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><rect x="1154" y="385" width="32" height="8" fill="#141414"/><text x="933" y="541" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">Raking side light</text><text x="933" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="933" dy="0">Texture is the product: bread crumb, fabric weave, a swatch,</tspan><tspan x="933" dy="17">a worn leather.</tspan></text><text x="933" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="933" dy="0">— Hard-ish source almost parallel to the surface</tspan></text><text x="933" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="933" dy="0">— Black flag opposite, so the shadows stay deep</tspan></text><rect x="60" y="699" width="252" height="252" fill="#EFE9DE"/><path d="M164.6,825.4 L153.9,901.1 L218.2,901.1 L207.5,825.4 Z" fill="#8A8478" opacity="0.38"/><circle cx="186" cy="825" r="19" fill="#141414"/><path d="M175,968 L197,968 L186,955 Z" fill="#141414"/><text x="204" y="968" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><circle cx="186" cy="715" r="18" fill="#2A4BD7"/><line x1="186" y1="715" x2="186" y2="825" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><circle cx="186" cy="931" r="18" fill="#D9541E"/><text x="60" y="1004" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">Backlight for translucency</text><text x="60" y="1030" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="60" dy="0">Anything light passes through: broth, tea, a cold drink, honey,</tspan><tspan x="60" dy="17">a thin fabric.</tspan></text><text x="60" y="1068" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="60" dy="0">— Source three-quarters behind, slightly off centre</tspan></text><text x="60" y="1088" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="60" dy="0">— Low front bounce so the near face is not black</tspan></text><rect x="497" y="699" width="252" height="252" fill="#EFE9DE"/><path d="M606.2,839.1 L646.0,904.3 L695.6,863.4 L639.3,811.8 Z" fill="#8A8478" opacity="0.38"/><circle cx="623" cy="825" r="19" fill="#141414"/><path d="M612,968 L634,968 L623,955 Z" fill="#141414"/><text x="641" y="968" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><rect x="547" y="722" width="10" height="35" fill="#2A4BD7"/><line x1="552" y1="740" x2="623" y2="825" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><rect x="688" y="796" width="32" height="8" fill="#141414"/><text x="497" y="1004" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">Strip for glass</text><text x="497" y="1030" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="497" dy="0">One long highlight down a bottle. Two highlights is what</tspan><tspan x="497" dy="17">makes glass look rendered.</tspan></text><text x="497" y="1068" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="497" dy="0">— Narrow tall soft strip, behind-left</tspan></text><text x="497" y="1088" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="497" dy="0">— Black card right — no second highlight, ever</tspan></text><rect x="933" y="699" width="252" height="252" fill="#EFE9DE"/><path d="M1038.0,825.4 L1027.3,901.1 L1091.5,901.1 L1080.8,825.4 Z" fill="#8A8478" opacity="0.38"/><circle cx="1059" cy="825" r="19" fill="#141414"/><path d="M1048,968 L1070,968 L1059,955 Z" fill="#141414"/><text x="1077" y="968" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.0" fill="#8A8478">camera</text><circle cx="1059" cy="735" r="28" fill="#2A4BD7"/><line x1="1059" y1="735" x2="1059" y2="825" stroke="#2A4BD7" stroke-width="2" stroke-dasharray="7 6"/><circle cx="1059" cy="916" r="18" fill="#D9541E"/><rect x="938" y="822" width="32" height="8" fill="#141414"/><rect x="1149" y="822" width="32" height="8" fill="#141414"/><text x="933" y="1004" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21.0" fill="#141414" font-weight="700">Overhead butterfly</text><text x="933" y="1030" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="933" dy="0">Beauty and makeup, where the makeup is the subject and</tspan><tspan x="933" dy="17">the shape must stay even.</tspan></text><text x="933" y="1068" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="933" dy="0">— Large soft source directly above and slightly front</tspan></text><text x="933" y="1088" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="933" dy="0">— Bounce under the chin</tspan></text><text x="933" y="1108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.0" fill="#141414"><tspan x="933" dy="0">— Black cards both sides for shape</tspan></text></svg>
