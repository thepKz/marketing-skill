<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="958" viewBox="0 0 1400 958"><rect width="1400" height="958" fill="#F5F1E8"/><text x="60" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38.0" fill="#141414" font-weight="700">One dial, three positions — margin_ratio</text><text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#8A8478"><tspan x="60" dy="0">How much empty edge surrounds everything. This one dial does more for perceived price than any colour choice. Same four items, same words, same colours</tspan><tspan x="60" dy="21">in all three. Only this one number changed. Raise it when: The product is premium, the reader is browsing, or the page has few items. Lower it when: The</tspan><tspan x="60" dy="21">page must hold many items, or it will be read at arm&#x27;s length on a counter. It breaks when: Below 0.05 the type touches the trim edge and any print shop will</tspan><tspan x="60" dy="21">cut into it</tspan></text><rect x="60" y="230" width="1280" height="2" fill="#141414"/><rect x="60" y="258" width="400" height="500" fill="#FFFFFF" stroke="#141414" stroke-width="2"/><text x="80" y="297" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24.8" fill="#141414" font-weight="700">Bún bò Huế</text><line x1="80" y1="340" x2="440" y2="340" stroke="#141414" stroke-width="1"/><text x="80" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò</text><text x="440" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="80" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò đặc biệt</text><text x="440" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="80" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò giò heo</text><text x="440" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="80" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Trà đá</text><text x="440" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="60" y="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#141414" font-weight="700">minimum · margin_ratio = 0.05</text><text x="60" y="814" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="60" dy="0">Cheapest-looking of the three, and the one a print shop will</tspan><tspan x="60" dy="17">cut into.</tspan></text><rect x="500" y="258" width="400" height="500" fill="#FFFFFF" stroke="#141414" stroke-width="2"/><text x="544" y="321" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24.8" fill="#141414" font-weight="700">Bún bò Huế</text><line x1="544" y1="364" x2="856" y2="364" stroke="#141414" stroke-width="1"/><text x="544" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò</text><text x="856" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="544" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò đặc biệt</text><text x="856" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="544" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò giò heo</text><text x="856" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="544" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Trà đá</text><text x="856" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="500" y="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#141414" font-weight="700">default · margin_ratio = 0.111</text><text x="500" y="814" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="500" dy="0">What the quiet-editorial theme ships with.</tspan></text><rect x="940" y="258" width="400" height="500" fill="#FFFFFF" stroke="#141414" stroke-width="2"/><text x="1004" y="341" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24.8" fill="#141414" font-weight="700">Bún bò Huế</text><line x1="1004" y1="384" x2="1276" y2="384" stroke="#141414" stroke-width="1"/><text x="1004" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò</text><text x="1276" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="1004" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò đặc biệt</text><text x="1276" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="1004" y="463" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Bún bò giò heo</text><text x="1276" y="463" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="1004" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414">Trà đá</text><text x="1276" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.0" fill="#141414" text-anchor="end">—</text><text x="940" y="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.0" fill="#141414" font-weight="700">maximum · margin_ratio = 0.16</text><text x="940" y="814" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.0" fill="#8A8478"><tspan x="940" dy="0">Most expensive-looking, and it fits the fewest items.</tspan></text></svg>
