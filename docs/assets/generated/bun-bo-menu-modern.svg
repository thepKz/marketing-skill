<text x="100" y="176" fill="#171717" class="title">Bún bò mỗi ngày</text><text x="100" y="208" fill="#171717" class="subtitle"><tspan x="100" dy="0">Bản minh họa bố cục — giá và thành phần phải</tspan><tspan x="100" dy="30">được quán xác nhận</tspan></text><ellipse cx="835" cy="183" rx="145" ry="69" fill="#231f20"/><ellipse cx="835" cy="165" rx="132" ry="52" fill="#a8432e"/><path d="M737 156 Q835 205 933 156" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M762 133 Q835 99 908 133" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<line x1="100" y1="336" x2="980" y2="336" stroke="#171717" stroke-opacity=".25"/><text x="100" y="372" fill="#df4b2e" class="category">MÓN CHÍNH</text><text x="100" y="442" class="item">Bún bò tiêu chuẩn</text><text x="100" y="470" class="desc">Tên, khẩu phần và thành phần chờ xác nhận</text><text x="980" y="442" text-anchor="end" class="price">—</text>
<text x="100" y="553" class="item">Bún bò đặc biệt</text><text x="100" y="581" class="desc">Không tự suy ra topping từ ảnh tham chiếu</text><text x="980" y="553" text-anchor="end" class="price">—</text>
<text x="100" y="664" class="item">Phần thêm</text><text x="100" y="692" class="desc">Chỉ hiển thị khi có menu và giá nguồn</text><text x="980" y="664" text-anchor="end" class="price">—</text>
<text x="100" y="775" class="item">Đồ uống</text><text x="100" y="803" class="desc">Sắp theo logic hoàn tất giỏ hàng</text><text x="980" y="775" text-anchor="end" class="price">—</text>
<line x1="100" y1="1024" x2="980" y2="1024" stroke="#171717" stroke-opacity=".25"/><text x="100" y="1056" fill="#171717" class="footer">CONCEPT LAYOUT / Không phải menu giá đã được duyệt</text>
