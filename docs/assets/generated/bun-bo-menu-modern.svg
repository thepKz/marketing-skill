<rect width="100%" height="100%" fill="#f5f1e8"/><rect x="70" y="70" width="940" height="8" fill="#df4b2e"/>
<text x="100" y="150" fill="#171717" class="kicker">BÚN BÒ / SIGNATURE MENU</text>
<text x="100" y="220" fill="#171717" class="title">Bún bò mỗi ngày</text><text x="100" y="260" fill="#171717" class="subtitle"><tspan x="100" dy="0">Bản minh họa bố cục — giá và thành phần phải</tspan><tspan x="100" dy="30">được quán xác nhận</tspan></text><ellipse cx="835" cy="230" rx="130" ry="62" fill="#231f20"/><ellipse cx="835" cy="214" rx="118" ry="47" fill="#a8432e"/><path d="M747 206 Q835 250 923 206" fill="none" stroke="#efc08a" stroke-width="8" stroke-linecap="round"/><path d="M770 185 Q835 155 900 185" fill="none" stroke="#f3d7b1" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<line x1="100" y1="420" x2="980" y2="420" stroke="#171717" stroke-opacity=".25"/><text x="100" y="465" fill="#df4b2e" class="category">MÓN CHÍNH</text><text x="100" y="500" class="item">Bún bò tiêu chuẩn</text><text x="100" y="528" class="desc">Tên, khẩu phần và thành phần chờ xác nhận</text><text x="980" y="500" text-anchor="end" class="price">—</text>
<text x="100" y="574" class="item">Bún bò đặc biệt</text><text x="100" y="602" class="desc">Không tự suy ra topping từ ảnh tham chiếu</text><text x="980" y="574" text-anchor="end" class="price">—</text>
<text x="100" y="648" class="item">Phần thêm</text><text x="100" y="676" class="desc">Chỉ hiển thị khi có menu và giá nguồn</text><text x="980" y="648" text-anchor="end" class="price">—</text>
<text x="100" y="722" class="item">Đồ uống</text><text x="100" y="750" class="desc">Sắp theo logic hoàn tất giỏ hàng</text><text x="980" y="722" text-anchor="end" class="price">—</text>
<line x1="100" y1="1280" x2="980" y2="1280" stroke="#171717" stroke-opacity=".25"/><text x="100" y="1320" fill="#171717" class="footer">CONCEPT LAYOUT / Không phải menu giá đã được duyệt</text>
