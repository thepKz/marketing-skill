<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title subtitle">
<title id="title">Bún bò mỗi ngày</title><desc id="subtitle">Bản minh họa bố cục — giá và thành phần phải được quán xác nhận</desc>
