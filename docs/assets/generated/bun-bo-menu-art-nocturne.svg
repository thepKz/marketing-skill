s-serif;fill:#f8f3e8}.art-marker{font:700 16px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#ff5b2e}.art-price{font:800 27px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#ff5b2e}.art-desc{font:400 17px Arial, 'Segoe UI', Tahoma, 'Liberation Sans', 'DejaVu Sans', 'Noto Sans', sans-serif;fill:#f8f3e8;opacity:.68}</style></svg>