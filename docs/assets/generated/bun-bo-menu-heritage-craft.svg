<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title subtitle">
<title id="title">Nấu theo lối cũ</title><desc id="subtitle">Quán và giá là ví dụ hư cấu — minh họa bố cục thật</desc>
<defs><clipPath id="hero-clip"><rect x="651" y="94" width="324" height="216" rx="0"/></clipPath></defs>
<rect width="100%" height="100%" fill="#e8ddc8"/><line x1="105" y1="56" x2="975" y2="56" stroke="#a85932" stroke-width="4"/><line x1="105" y1="62" x2="975" y2="62" stroke="#a85932" stroke-width="2"/>
<text x="105" y="110" fill="#24362b" class="kicker"><tspan x="105" dy="0">BÚN BÒ / QUÁN NHÀ</tspan></text>
<text x="105" y="185" fill="#24362b" class="title"><tspan x="105" dy="0">Nấu theo lối cũ</tspan></text><text x="105" y="233" fill="#24362b" class="subtitle"><tspan x="105" dy="0">Quán và giá là ví dụ hư cấu — minh họa bố</tspan><tspan x="105" dy="30">cục thật</tspan></text><image href="bun-bo-photoreal-menu-hero.png" x="651" y="94" width="324" height="216" preserveAspectRatio="xMidYMid slice" clip-path="url(#hero-clip)"/>
<line x1="105" y1="354" x2="975" y2="354" stroke="#24362b" stroke-opacity=".25"/><text x="105" y="479" fill="#a85932" class="category">MÓN CHÍNH</text><circle cx="115" cy="531" r="5" fill="#a85932"/><text x="151" y="539" class="item"><tspan x="151" dy="0">Bún bò giò heo</tspan></text><text x="151" y="568" class="desc"><tspan x="151" dy="0">Chân giò hầm mềm, nêm sả và mắm ruốc theo lối Huế</tspan></text><text x="975" y="539" text-anchor="end" class="price">65.000đ</text><line x1="374" y1="533" x2="856" y2="533" stroke="#24362b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
<circle cx="115" cy="648" r="5" fill="#a85932"/><text x="151" y="656" class="item"><tspan x="151" dy="0">Bún bò đặc biệt</tspan></text><text x="151" y="685" class="desc"><tspan x="151" dy="0">Đủ giò, chả cua, huyết, thịt bò tái</tspan></text><text x="975" y="656" text-anchor="end" class="price">79.000đ</text><line x1="383" y1="650" x2="856" y2="650" stroke="#24362b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
<circle cx="115" cy="765" r="5" fill="#a85932"/><text x="151" y="773" class="item"><tspan x="151" dy="0">Chả cua chiên</tspan></text><text x="151" y="802" class="desc"><tspan x="151" dy="0">Món thêm, giòn ngoài mềm trong</tspan></text><text x="975" y="773" text-anchor="end" class="price">25.000đ</text><line x1="365" y1="767" x2="856" y2="767" stroke="#24362b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
<circle cx="115" cy="882" r="5" fill="#a85932"/><text x="151" y="890" class="item"><tspan x="151" dy="0">Trà đá / trà chanh</tspan></text><text x="151" y="919" class="desc"><tspan x="151" dy="0">Đi kèm mọi phần chính, giải nhiệt</tspan></text><text x="975" y="890" text-anchor="end" class="price">10.000đ</text><line x1="410" y1="884" x2="856" y2="884" stroke="#24362b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
<line x1="105" y1="1024" x2="975" y2="1024" stroke="#24362b" stroke-opacity=".25"/><text x="105" y="1056" fill="#24362b" class="footer">CONCEPT MENU / Quán, món và giá đều hư cấu — minh họa bố cục</text>
