name: Validate skill and deploy handbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify consolidated structure
        shell: bash
        run: |
          test -f marketing-minthep/SKILL.md
          test -f marketing-minthep/agents/openai.yaml
          test -f .claude/skills/marketing-minthep/SKILL.md
          test -f .codex/skills/marketing-minthep/SKILL.md
          test -f marketing-minthep/references/realistic-studio-imagery.md
          test -f marketing-minthep/references/reference-first-image-flow.md
          test -f marketing-minthep/references/api-image-orchestration.md
          test -f marketing-minthep/references/makeup-art-direction.md
          test -f marketing-minthep/references/virtual-person-system.md
          test -f marketing-minthep/references/content-system.md
          test -f marketing-minthep/references/marketing-system-router.md
          test -f marketing-minthep/references/commerce-merchandising.md
          test -f marketing-minthep/references/paid-media-creative.md
          test -f marketing-minthep/references/pr-communications.md
          test -f marketing-minthep/references/sales-enablement.md
          test -f marketing-minthep/references/creator-ugc.md
          test -f marketing-minthep/references/lifecycle-retention.md
          test -f marketing-minthep/references/dossiers/README.md
          test -f marketing-minthep/references/dossiers/anti-fabrication-protocol.md
          test -f marketing-minthep/references/dossiers/colour-science-and-harmony.md
          test -f marketing-minthep/references/dossiers/composition-and-layout-vision.md
          test -f marketing-minthep/references/dossiers/food-and-beverage-imagery.md
          test -f marketing-minthep/references/dossiers/copywriting-deep.md
          test -f marketing-minthep/references/dossiers/image-prompt-engineering.md
          test -f marketing-minthep/references/dossiers/layout-wireframe-typography.md
          test -f marketing-minthep/references/dossiers/light-and-shadow.md
          test -f marketing-minthep/references/dossiers/market-assessment-method.md
          test -f marketing-minthep/references/dossiers/materials-and-surfaces.md
          test -f marketing-minthep/references/dossiers/menu-design-and-engineering.md
          test -f marketing-minthep/references/dossiers/resolution-sharpening-output.md
          test -f marketing-minthep/references/dossiers/video-craft-and-production.md
          test -f marketing-minthep/references/dossiers/vietnam-market-context.md
          test -f marketing-minthep/assets/registries/asset-formats.json
          test -f marketing-minthep/assets/registries/pipelines.json
          test -f marketing-minthep/scripts/new_run.py
          test -f marketing-minthep/scripts/start_workbench.py
          test -f marketing-minthep/scripts/evaluate_workbench.py
          test -f marketing-minthep/assets/evals/routing-cases.json
          test -f marketing-minthep/scripts/run_status.py
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f docs/i18n.js
          test -f docs/assets/references/ATTRIBUTION.txt
          test -f docs/assets/references/aespa-red-carpet-2024.jpg
          test -f docs/assets/references/wonyoung-editorial-2020.jpg
          test -f docs/assets/references/wonyoung-portrait-2025.jpg
          # Seventeen scraped photographs of real people were deleted on 2026-07-29. This job kept
          # demanding five of them for five days, so the gate was red for the right reason: the
          # repository refuses to ship them. Inverted rather than dropped - a build that puts one
          # back should fail here, not pass quietly.
          test ! -e docs/assets/references/instagram-for-everyoung10.jpg
          test ! -e docs/assets/references/instagram-goyounjung.jpg
          test ! -e docs/assets/references/instagram-katarinabluu.jpg
          test ! -e docs/assets/references/winter-mirror-makeup.jpg
          test ! -e docs/assets/references/karina-fullbody-negative-space.jpg
          test -f docs/assets/generated/minthep-serum-packshot.png
          test -f docs/assets/generated/minthep-beauty-campaign.png
          test -f docs/assets/generated/minthep-serum-key-visual.png
          test -f docs/assets/generated/minthep-fashion-look.png
          test -f docs/assets/generated/refsheet-dial-margin.svg
          test -f docs/assets/generated/refsheet-frames.svg
          test -f docs/assets/generated/refsheet-lighting.svg
          test -f docs/assets/generated/refsheet-palettes.svg
          test -f docs/assets/generated/refsheet-ratios.svg
          test -f docs/assets/generated/refsheet-reference.svg
          test -f docs/assets/generated/bun-bo-menu-heritage-craft.svg
          test -f docs/assets/generated/bun-bo-menu-modern-street.svg
          test -f docs/assets/generated/bun-bo-menu-quiet-editorial.svg
          test -f docs/assets/generated/bun-bo-menu-art-broadsheet.svg
          test -f docs/assets/generated/bun-bo-menu-art-counter-signal.svg
          test -f docs/assets/generated/bun-bo-menu-art-gallery-mono.svg
          test -f docs/assets/generated/bun-bo-menu-art-lacquer.svg
          test -f docs/assets/generated/bun-bo-menu-art-nocturne.svg
          test -f docs/assets/generated/bun-bo-photoreal-menu-hero.png
          test -f docs/assets/generated/bun-bo-lacquer-table.png
          test -f docs/assets/generated/bun-bo-counter.png
          test -f docs/assets/generated/bun-bo-broadsheet.png
          test -f docs/assets/generated/bun-bo-gallery-mono.png
          test -f docs/assets/generated/bun-bo-ai-menu-night-opera.png
          test -f docs/assets/generated/bun-bo-ai-menu-street-riso.png
          test -f docs/assets/generated/bun-bo-ai-menu-botanical-atlas.png
          test -f docs/assets/generated/bun-bo-ai-menu-full-proof.png
          test -f docs/assets/generated/bun-bo-multi-food-reference-board.png
          test -f docs/assets/generated/bun-bo-brand-led-mam-goi-mon-v1.png
          test -f docs/assets/generated/bun-bo-ai-order-ledger-menu.png
          test -f docs/assets/generated/bun-bo-food-ref-banh-bot-loc.png
          test -f docs/assets/generated/bun-bo-food-ref-banh-rang-bua.png
          test -f docs/assets/generated/bun-bo-food-ref-tra-dao.png
          test -f docs/assets/generated/bun-bo-full-ai-broth-map.png
          test -f docs/assets/generated/bun-bo-full-ai-broth-map-type-v4.png
          test -f docs/assets/generated/bun-bo-full-ai-blueprint-ref-v2.png
          test -f docs/assets/generated/bun-bo-post-feed.svg
          test -f docs/assets/generated/bun-bo-post-story.svg
          test -f docs/gallery-manifest.js
          test -f docs/build-gallery-manifest.mjs
          test ! -e marketing-content-art-director
          test ! -e marketing-creative-director
          test ! -e marketing-one-page-studio
          test ! -e web-studio

      - name: Run deterministic tool tests
        run: python -m unittest discover -s marketing-minthep/scripts -p "test_*.py"

      - name: Smoke-test all-in-one planner and manifest
        shell: bash
        run: |
          python marketing-minthep/scripts/plan_marketing_system.py \
            --input marketing-minthep/assets/examples/all-in-one-product-request.json \
            --output /tmp/marketing-plan.json
          python marketing-minthep/scripts/build_asset_manifest.py \
            --input /tmp/marketing-plan.json \
            --format json \
            --output /tmp/asset-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/marketing-plan.json').read_text())
          manifest = json.loads(Path('/tmp/asset-manifest.json').read_text())
          assert plan['asset_count'] == len(plan['selected_assets'])
          assert 0 < len(manifest) <= plan['asset_count']
          assert len({row['asset_type'] for row in manifest}) == len(manifest)
          PY

      - name: Smoke-test run workspace scaffold and audit
        shell: bash
        run: |
          python marketing-minthep/scripts/new_run.py \
            --request "tôi muốn lên kế hoạch marketing cho quán bún bò Huế" \
            --mode system --date 2026-01-01 --root "$RUNNER_TEMP/run-smoke" \
            --output "$RUNNER_TEMP/scaffold.json"
          RUN=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['run_dir'])" \
            "$RUNNER_TEMP/scaffold.json")
          test -f "$RUN/run.json"
          test -f "$RUN/README.md"
          test -f "$RUN/05-positioning.vi.md"
          test -f "$RUN/05-positioning.en.md"
          python marketing-minthep/scripts/run_status.py --run "$RUN" --json \
            --output "$RUNNER_TEMP/audit.json"
          python - "$RUNNER_TEMP/scaffold.json" "$RUNNER_TEMP/audit.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          scaffold = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          report = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert scaffold['pipeline'] == 'plan-from-zero', scaffold['pipeline']
          assert scaffold['run_id'].endswith('-bun-bo'), scaffold['run_id']
          bilingual = [item for item in scaffold['deliverables'] if item['bilingual']]
          assert len(bilingual) > 5, len(bilingual)
          assert all(len(item['paths']) == 2 for item in bilingual)
          # A freshly scaffolded run must never audit as usable work.
          assert report['filled'] is False
          assert report['complete'] is False
          assert report['total_unfilled_sections'] > 50, report['total_unfilled_sections']
          assert '01-intake' in report['blocking']
          PY
          # --strict must refuse an unfilled run.
          if python marketing-minthep/scripts/run_status.py --run "$RUN" --strict \
               --output "$RUNNER_TEMP/strict.txt"; then
            echo "run_status.py --strict passed an unfilled run; the completeness gate is broken"
            exit 1
          fi

      - name: Evaluate routing and linked workbenches
        run: python marketing-minthep/scripts/evaluate_workbench.py --output "$RUNNER_TEMP/workbench-evaluation.json"

      - name: Compile Python tools
        run: python -m compileall -q marketing-minthep/scripts

      - name: Validate handbook JavaScript
        run: |
          node --check docs/i18n.js
          node --check docs/gallery-manifest.js
          node --check docs/build-gallery-manifest.mjs
          node --check docs/app.js
          node docs/build-gallery-manifest.mjs
          git diff --exit-code -- docs/gallery-manifest.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static handbook
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
