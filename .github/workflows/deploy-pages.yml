name: Deploy handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# This workflow only publishes docs/ to GitHub Pages. The skill carries no CI test suite
# on purpose: the gates in marketing-minthep/scripts/ are runtime instruments that run on
# the operator's own draft at the moment of use — every run is the test. A CI layer that
# re-proved yesterday's file structure turned every refactor into a broken build and every
# doc that quoted it into a stale claim, so it was deleted on 2026-08-07.

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static handbook
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
